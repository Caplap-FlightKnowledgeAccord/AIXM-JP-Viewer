# AIP/NOTAM 可視化システム - Nginx HTTPS リバースプロキシ設定
# 自己署名SSL証明書を使用してHTTPSを提供し、バックエンドの uvicorn (port 8000) にプロキシします。

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS サーバー
server {
    listen 443 ssl;
    server_name _;

    # SSL証明書のパス (setup_ubuntu.sh で自動生成)
    ssl_certificate     /etc/ssl/certs/aixm-viewer-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/aixm-viewer-selfsigned.key;

    # SSL セキュリティ設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # リバースプロキシ設定
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket サポート (将来のリアルタイム更新用)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # タイムアウト設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静的ファイルのキャッシュ
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
